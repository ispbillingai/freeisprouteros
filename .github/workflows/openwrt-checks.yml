name: OpenWrt customization checks
on:
  push:
    paths: ['openwrt/**', 'tools/openwrt/**', '.github/workflows/openwrt-checks.yml']
  pull_request:
    paths: ['openwrt/**', 'tools/openwrt/**', '.github/workflows/openwrt-checks.yml']
permissions:
  contents: read
jobs:
  overlay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and menu definitions
        run: |
          for f in tools/openwrt/*.sh openwrt/files/etc/uci-defaults/* openwrt/files/usr/bin/*; do sh -n "$f"; done
          python3 -m json.tool openwrt/files/usr/share/luci/menu.d/luci-app-freeisp.json > /dev/null
          python3 -m json.tool openwrt/files/usr/share/luci/menu.d/luci-app-freeisp-files.json > /dev/null
          python3 -m json.tool openwrt/files/usr/share/rpcd/acl.d/luci-app-freeisp-files.json > /dev/null
          node --check openwrt/files/www/luci-static/resources/view/freeisp/overview.js
          node --check openwrt/files/www/luci-static/resources/view/freeisp/quickset.js
          node --check openwrt/files/www/luci-static/resources/view/freeisp/files.js
          node --check openwrt/files/www/luci-static/resources/view/freeisp/queues.js
          node --check openwrt/files/www/luci-static/resources/freeisp/queues-data.js
          node tools/openwrt/test-queues.cjs
          node tools/openwrt/test-quickset.cjs
          python3 -m json.tool openwrt/files/usr/share/rpcd/acl.d/luci-app-freeisp.json > /dev/null
          node --check openwrt/files/www/luci-static/freeisp/navigation.js
          python3 -m py_compile tools/openwrt/verify.py
          python3 -m py_compile tools/openwrt/test-files-backend.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Files interactions in a browser
        run: |
          npm install --prefix "$RUNNER_TEMP/freeisp-files-tests" playwright@1.62.1
          "$RUNNER_TEMP/freeisp-files-tests/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/freeisp-files-tests/node_modules" node tools/openwrt/test-files-ui.cjs
