name: OpenWrt customization checks
on:
  push:
    paths: ['openwrt/**', 'tools/openwrt/**', '.github/workflows/openwrt-checks.yml']
  pull_request:
    paths: ['openwrt/**', 'tools/openwrt/**', '.github/workflows/openwrt-checks.yml']
permissions:
  contents: read
jobs:
  overlay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and menu definitions
        run: |
          for f in tools/openwrt/*.sh openwrt/files/etc/uci-defaults/* openwrt/files/usr/bin/*; do sh -n "$f"; done
          python3 -m json.tool openwrt/files/usr/share/luci/menu.d/luci-app-freeisp.json > /dev/null
          python3 -m json.tool openwrt/files/usr/share/luci/menu.d/luci-app-freeisp-files.json > /dev/null
          python3 -m json.tool openwrt/files/usr/share/rpcd/acl.d/luci-app-freeisp-files.json > /dev/null
          node --check openwrt/files/www/luci-static/resources/view/freeisp/overview.js
          node --check openwrt/files/www/luci-static/resources/view/freeisp/quickset.js
          node --check openwrt/files/www/luci-static/resources/view/freeisp/files.js
          node --check openwrt/files/www/luci-static/resources/view/freeisp/queues.js
          node --check openwrt/files/www/luci-static/resources/freeisp/queues-data.js
          node tools/openwrt/test-queues.cjs
          node --check openwrt/files/www/luci-static/resources/view/freeisp/pppoe.js
          python3 -B tools/openwrt/test_pppoe.py
          python3 -m json.tool openwrt/files/usr/share/luci/menu.d/luci-app-freeisp-pppoe.json > /dev/null
          python3 -m json.tool openwrt/files/usr/share/rpcd/acl.d/luci-app-freeisp-pppoe.json > /dev/null
          sh -n openwrt/files/etc/init.d/freeisp-pppoe
          for f in openwrt/files/usr/libexec/freeisp-pppoe-{pre-up,up,down}; do sh -n "$f"; done
          node tools/openwrt/test-quickset.cjs
          node --check openwrt/files/www/luci-static/resources/view/freeisp/tools.js
          node --check tools/openwrt/test-tools-ui.cjs
          sh -n openwrt/files/etc/init.d/freeisp-tools
          python3 -m json.tool openwrt/files/usr/share/luci/menu.d/luci-app-freeisp-tools.json > /dev/null
          python3 -m json.tool openwrt/files/usr/share/rpcd/acl.d/luci-app-freeisp-tools.json > /dev/null
          python3 -m py_compile tools/openwrt/test-tools-vm.py tools/openwrt/tools_vm_client.py tools/openwrt/tools-smtp-fixture.py tools/openwrt/tools-console.py
          node --check openwrt/files/www/luci-static/resources/view/freeisp/ip-service.js
          node --check openwrt/files/www/luci-static/resources/freeisp/ip-service-data.js
          node tools/openwrt/test-ip-service.cjs
          node --check openwrt/files/www/luci-static/resources/view/freeisp/api-settings.js
          node --check openwrt/files/www/luci-static/resources/view/freeisp/ftp-settings.js
          node tools/openwrt/test-ftp.cjs
          python3 tools/openwrt/test-api-service.py
          sh -n openwrt/files/etc/init.d/freeisp-api
          sh -n openwrt/files/etc/init.d/freeisp-ftp
          sh -n openwrt/files/usr/lib/freeisp/ftp.sh
          python3 -m json.tool openwrt/files/usr/share/luci/menu.d/luci-app-freeisp-ip-service.json > /dev/null
          python3 -m json.tool openwrt/files/usr/share/rpcd/acl.d/luci-app-freeisp-ip-service.json > /dev/null
          python3 -m json.tool openwrt/files/usr/share/rpcd/acl.d/luci-app-freeisp.json > /dev/null
          node --check openwrt/files/www/luci-static/freeisp/navigation.js
          python3 -m py_compile tools/openwrt/verify.py
          python3 -m py_compile tools/openwrt/test-files-backend.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Files interactions in a browser
        run: |
          npm install --prefix "$RUNNER_TEMP/freeisp-files-tests" playwright@1.62.1
          "$RUNNER_TEMP/freeisp-files-tests/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/freeisp-files-tests/node_modules" node tools/openwrt/test-files-ui.cjs
          node --check openwrt/files/www/luci-static/resources/view/freeisp/command-line.js
          node --check openwrt/files/www/luci-static/resources/freeisp/command-line.js
          node --check openwrt/files/www/luci-static/resources/freeisp/command-line-backend.js
          node tools/openwrt/test-command-line.cjs
      - name: Validate Hotspot integration and backend
        run: |
          python3 -m json.tool openwrt/files/usr/share/luci/menu.d/luci-app-freeisp-hotspot.json > /dev/null
          python3 -m json.tool openwrt/files/usr/share/rpcd/acl.d/luci-app-freeisp-hotspot.json > /dev/null
          sh -n openwrt/files/etc/init.d/freeisp-hotspot
          sh -n openwrt/files/usr/libexec/rpcd/freeisp.hotspot
          node --check openwrt/files/www/luci-static/resources/view/freeisp/hotspot.js
          python3 -m unittest discover -s tools/openwrt -p 'test_hotspot*.py' -v
      - name: Install browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Test Hotspot interface
        run: node tools/openwrt/test-hotspot-ui.cjs
      - name: Test Hotspot packets in disposable Linux namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables iproute2 iputils-ping
          sudo python3 tools/openwrt/test_hotspot_runtime.py -v
          node tools/openwrt/test-interfaces.cjs
          node tools/openwrt/test-firewall.cjs
          node tools/openwrt/test-firewall-runtime.cjs
          node --check openwrt/files/www/luci-static/resources/view/freeisp/interfaces.js
          node --check openwrt/files/www/luci-static/resources/view/freeisp/firewall.js
